name: CI

# PR validation + SonarCloud analysis. Also runs on pushes to `main` so the
# SonarCloud quality gate has a baseline for the default branch — that run
# is separate from `release.yml`, which only packs and publishes to NuGet.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SONAR_PROJECT_KEY: VisuAuth_VisuAuth
  SONAR_ORGANIZATION: visuauth
  # Hoisted to workflow level so the steps below can test it in `if:` —
  # secrets are not readable from a step-level `if`. It is empty on any run
  # without access to repository secrets: Dependabot PRs (which use a separate
  # secret store) and pull requests from forks. The Sonar steps skip in that
  # case instead of failing the whole job with "sonar.token= is invalid",
  # which is what blocked every such PR. Build, tests, and pack still run, so
  # the PR is still genuinely verified — it just carries no Sonar report.
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          # SonarCloud needs the full history for accurate blame / new-code detection.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Java (required by SonarScanner)
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache SonarCloud packages
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarScanner tool
        id: cache-sonar-scanner
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@v6
        with:
          path: ./.sonar/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarScanner tool
        if: env.SONAR_TOKEN != '' && steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./.sonar/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner

      - name: Restore
        run: dotnet restore src/VisuAuth.slnx

      - name: SonarScanner begin
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./.sonar/scanner/dotnet-sonarscanner begin \
            /k:"${SONAR_PROJECT_KEY}" \
            /o:"${SONAR_ORGANIZATION}" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="samples/**,tests/**,**/*.js,**/*.css" \
            /d:sonar.exclusions="samples/**" \
            /d:sonar.cpd.exclusions="**/VisuAuth.EntraExternal/EntraExternalUserStore.cs,**/VisuAuth.EntraExternal/EntraExternalRoleStore.cs,**/VisuAuth.EntraExternal/EntraExternalAuthenticationFlow.cs,**/VisuAuth.EntraExternal/Mapping/EntraExternalUserMapper.cs"

      - name: Build
        id: build
        run: dotnet build src/VisuAuth.slnx --configuration Release --no-restore

      - name: Unit tests
        run: |
          dotnet test tests/VisuAuth.UnitTests/VisuAuth.UnitTests.csproj \
            --configuration Release --no-build --verbosity minimal \
            --collect:"XPlat Code Coverage;Format=opencover" --results-directory ./coverage

      - name: Integration tests
        # Run integration even if unit tests failed, so the report shows both
        # outcomes; the job still fails on any test failure. Gated on the build
        # having succeeded, because `--no-build` against a missing build reports
        # a baffling "the argument ....dll is invalid" that buries the real
        # cause further up the log.
        if: "!cancelled() && steps.build.outcome == 'success'"
        run: |
          dotnet test tests/VisuAuth.IntegrationTests/VisuAuth.IntegrationTests.csproj \
            --configuration Release --no-build --verbosity minimal \
            --collect:"XPlat Code Coverage;Format=opencover" --results-directory ./coverage

      - name: SonarScanner end
        if: "!cancelled() && env.SONAR_TOKEN != ''"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

      - name: Pack
        run: dotnet pack src/VisuAuth.slnx --configuration Release --no-build --output ./artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg
          retention-days: 7
