name: CI

# Pull-request validation only. Pushes to `main` are handled by
# `release.yml`, which also publishes to NuGet — no duplication.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/VisuAuth.slnx

      - name: Build
        run: dotnet build src/VisuAuth.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test src/VisuAuth.slnx --configuration Release --no-build --verbosity minimal

      - name: Pack
        run: dotnet pack src/VisuAuth.slnx --configuration Release --no-build --output ./artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg
          retention-days: 7
