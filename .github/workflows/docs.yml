name: docs

# Build the MkDocs site and publish it to GitHub Pages.
# Runs on every push to main that touches the docs, and can be triggered
# manually. The build job also runs on PRs (without deploying) so a broken
# site fails the check before it lands.

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install MkDocs Material
        # Pinned + binary-only: locks the resolved version and never runs a
        # package's setup script during install. Block scalar so the
        # `:all:` colon-space doesn't break YAML plain-scalar parsing.
        run: |
          pip install --only-binary :all: mkdocs-material==9.6.21

      - name: Build site (strict)
        # --strict turns broken links / missing nav files into build errors,
        # so a typo'd path fails CI instead of shipping a dead page.
        run: mkdocs build --strict

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    # Only publish from main — PR / feature-branch builds validate only and
    # never touch the github-pages environment (whose protection rules would
    # otherwise fail the run at startup on a non-main ref).
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
